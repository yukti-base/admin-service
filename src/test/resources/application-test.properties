# Integration-test profile.
#
# Points at a THROWAWAY database (yuktisetu_test) with ddl-auto=create-drop, so
# tests build their own schema from the entities and tear it down afterwards.
# Nothing here ever touches yuktisetu, yuktisetu_drive or Neon -- a test run must
# not leave rows in a database anyone is working in.
spring.application.name=admin-service-test
server.port=0

spring.datasource.url=jdbc:postgresql://localhost:5432/yuktisetu_test
spring.datasource.username=yuktisetu
spring.datasource.password=YuktiSetu!2026@
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

yuktisetu.jwt.public-key-path=classpath:/keys/public.pem
yuktisetu.jwt.issuer=auth-service

# Everything scheduled or brokered is OFF: tests drive the code directly so a
# background sweep cannot race the assertions.
yuktisetu.kafka.enabled=false

# Email stays ENABLED so core's EmailAutoConfiguration still publishes the
# EmailService bean -- TriggerNotificationService requires it, and disabling the
# flag removes the bean and takes the whole context down with it.
#
# Instead the SMTP host points at a dead port, so nothing can leave the machine.
# The invite send is already wrapped in try/catch, so a refused connection is
# logged and the import continues -- which is the behaviour under test anyway.
app.email.enabled=true
app.email.default-from=test@example.test
app.email.default-from-name=Test
app.email.base-invite-url=http://localhost:3000/accept-invite
app.notification.debug=false
spring.mail.host=127.0.0.1
spring.mail.port=2525
management.health.redis.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=YuktiSetu@2026
spring.data.redis.timeout=2000ms

# Storage must be ENABLED so the FileStorageService bean exists -- JobPostingService
# requires it and the context will not start without it. The credentials are
# deliberately fake: no test in this suite performs an upload, so nothing is ever
# sent, and a fake account means an accidental upload fails loudly instead of
# landing in the real Cloudinary space.
yuktisetu.storage.enabled=true
yuktisetu.storage.cloud-name=test-cloud
yuktisetu.storage.api-key=test-key
yuktisetu.storage.api-secret=test-secret
yuktisetu.storage.root-folder=yuktisetu-test
