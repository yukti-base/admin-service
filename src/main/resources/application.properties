spring.application.name=admin-service
server.servlet.context-path=/api/admin

server.port=8082

# Default profile, matching user-service. Both services inject FileStorageService,
# whose bean is conditional on storage properties that only exist in the profile
# files -- so starting with no profile at all (an IDE run, or a bare bootRun)
# fails at context initialisation with an unhelpful "No qualifying bean of type
# FileStorageService". A command-line --spring.profiles.active=dev still wins,
# since CLI args outrank properties files, so infra/scripts/run-local-stack.sh is unaffected.
spring.profiles.active=local

# Outbox relay (2026-11-01): with the broker down, a send must give up within
# seconds so the relay's backoff takes over. The default max.block.ms (60 s) held
# the relay -- and its row locks -- for a minute per attempt.
spring.kafka.producer.properties.max.block.ms=10000
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.producer.properties.request.timeout.ms=5000
