# Kafka. admin-service is a PRODUCER only -- it has no listeners. The outbox
# relay ships posting.published rows written by JobPostingService on publish.
# Before this existed those rows accumulated as PENDING with nothing to drain
# them, so a drive marked notifyOnPublish reached nobody.
yuktisetu.kafka.enabled=true
spring.kafka.bootstrap-servers=localhost:9092
yuktisetu.outbox.relay.fixed-delay-ms=2000

# Object storage (Cloudinary). Required, not optional: admin-service's JD upload
# and user-service's student documents both inject FileStorageService, and the
# bean only exists when yuktisetu.storage.enabled=true. Without this block the
# whole service fails to start -- which is exactly what happened when dev was
# left without it.
yuktisetu.storage.enabled=true
yuktisetu.storage.cloud-name=${CLOUDINARY_CLOUD_NAME:dedhzsghv}
yuktisetu.storage.api-key=${CLOUDINARY_API_KEY:738632164957489}
yuktisetu.storage.api-secret=${CLOUDINARY_API_SECRET:23N0CQcysxzL0OcI4EeZAbyP0a4}
yuktisetu.storage.root-folder=yuktisetu
yuktisetu.storage.max-file-size-bytes=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ------------------------------------------------------------------
# Portal URLs. These end up as the clickable link in every notification --
# the "View drive" button in an email and the actionUrl on an in-app row --
# so they must be where a human can actually reach the app, not where the
# service happens to be listening.
#
# Student-facing notices link to the student portal, staff-facing ones to
# the admin portal. Both are dev-server ports here; on a real deployment
# these become the two public hostnames.
# ------------------------------------------------------------------
yuktisetu.portal.student-url=http://localhost:3001
yuktisetu.portal.admin-url=http://localhost:3000
