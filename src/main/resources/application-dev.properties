# ===========================================================================
# dev profile -- points at the SHARED Neon database.
#
# `local` is the default for day-to-day work and uses local Postgres. Use this
# profile only when you deliberately need the shared data:
#     ./gradlew bootRun --args='--spring.profiles.active=dev'
#
# Everything below is identical to application-local.properties except the
# datasource block. Keep them in sync when either changes.
#
# NOTE: this uses the -pooler host. migrate.sh deliberately uses the DIRECT
# host (no -pooler) because pg_dump needs a stable session; the two are not
# interchangeable.
# ===========================================================================

spring.application.name=admin-service
server.port=8082

logging.level.org.yuktisetu.authservice.service.RoleManagementService=DEBUG

# Local PostgreSQL
spring.datasource.url=jdbc:postgresql://ep-sparkling-mouse-ayji4291-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_NGeLjF2YWKt1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Never let Hibernate own schema changes from an entity library in prod ?
# schema changes go through your migration tool, not auto-DDL.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Local Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=YuktiSetu@2026
spring.data.redis.timeout=2000ms

# RS256 keypair.
# Generate with:
#   openssl genpkey -algorithm RSA -out private.pem -pkeyopt rsa_keygen_bits:2048
#   openssl rsa -pubout -in private.pem -out public.pem
#
# For local development, keep the keys at these paths.
yuktisetu.jwt.public-key-path=classpath:/keys/public.pem
yuktisetu.jwt.issuer=auth-service


